name: payment_auto_approver
description: "Payment Auto-Approver Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (Cubit)
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking & Auth Storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.20.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1
  device_info_plus: ^11.3.0

  # Background & Notifications
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^18.0.1

  # SMS Inbox
  flutter_sms_inbox: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
